@if (dialogService.isOpen() && dialogService.config(); as config) {

  <div class="dialog-backdrop" (click)="closeOnBackdrop($event)">

    <div
      class="dialog"
      [class]="'dialog--' + (config.variant || 'warning')"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-message"
    >

      <button
        type="button"
        class="dialog-close"
        aria-label="Close dialog"
        (click)="dialogService.cancel()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>

      <div class="dialog-content">

        <div class="dialog-icon">
          @switch (config.variant) {
            @case ('danger') {
              <!-- trash icon -->
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M10 11v6M14 11v6" />
              </svg>
            }
            @case ('info') {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4M12 8h.01" />
              </svg>
            }
            @default {
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                <path d="M12 9v4M12 17h.01" />
              </svg>
            }
          }
        </div>

        <div class="dialog-text">
          <h3 id="dialog-title">{{ config.title }}</h3>
          <p id="dialog-message">{{ config.message }}</p>
        </div>

      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-cancel" (click)="dialogService.cancel()">
          {{ config.cancelText || 'Cancel' }}
        </button>

        <button type="button" class="btn btn-confirm" (click)="dialogService.confirm()">
          {{ config.confirmText || 'Confirm' }}
        </button>
      </div>

    </div>
  </div>

}
