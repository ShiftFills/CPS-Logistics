<div class="time-picker-container">

  @if (label()) {
    <label>
      {{ label() }}

      @if (required()) {
        <span class="required">*</span>
      }
    </label>
  }

  <input
    type="time"
    [value]="value()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [disabled]="disabled()"
    [required]="required()"
    (change)="onChange($event)"
  />

</div>
