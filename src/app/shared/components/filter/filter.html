<div class="filter-panel">

  <div class="filter-header">
    <h3>Filters</h3>
  </div>

  <div class="filter-body">

    @for (filter of filters(); track filter.key) {

      <div class="filter-field">

        <label>
          {{ filter.label }}
        </label>

        @if (filter.type === 'text') {

          <input
            type="text"
            [placeholder]="'Search ' + filter.label"
            [value]="filterValues()[filter.key] || ''"
            (input)="
              updateValue(
                filter.key,
                $any($event.target).value
              )
            "
          />

        }

        @if (filter.type === 'select') {

          <select
            [value]="filterValues()[filter.key] || ''"
            (change)="
              updateValue(
                filter.key,
                $any($event.target).value
              )
            "
          >

            <option value="">
              All
            </option>

            @for (
              option of filter.options || [];
              track option.value
            ) {

              <option [value]="option.value">
                {{ option.label }}
              </option>

            }

          </select>

        }

      </div>

    }

  </div>

  <div class="filter-footer">

    <button
      type="button"
      (click)="clearFilters()">
      Clear
    </button>

    <button
      type="button"
      (click)="applyFilters()">
      Apply
    </button>

  </div>

</div>
