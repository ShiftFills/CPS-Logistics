<header class="header-toolbar">
    <!-- Mobile Menu Button -->
    <button class="mobile-toggle-btn" (click)="onToggleSidebar()" aria-label="Toggle Sidebar">
        <i class="icon icon-menu"></i>
    </button>



    <div class="user-greeting">
        <span class="breadcrumb-title">Transport Booking Overview</span>

        <span class="breadcrumb-current">
            <span class="breadcrumb-separator">/</span>
            Status Update
        </span>
    </div>

    <!-- Right: Actions, Search, Notifications & Profile -->
    <div class="header-actions">
        <!-- Global Search -->
        <!-- <div class="search-box">
      <i class="icon icon-search-input"></i>
      <input type="text" placeholder="Search leads, customers, vehic..." />
    </div> -->
        <div class="header-search">
            <app-search-box placeholder="Search leads, customers, vehic..." (searchChange)="onSearchChange($event)"
                width="250px" height="32px" />
        </div>
        <!-- Dark Mode Toggle Button -->
        <button class="action-btn theme-toggle" (click)="toggleTheme()"
            [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'">
            <i class="icon" [class.icon-sun]="isDarkMode" [class.icon-moon]="!isDarkMode"></i>
        </button>

        <!-- Notification Indicator Button -->
        <button class="action-btn notification-btn" aria-label="Notifications">
            <i class="icon icon-bell"></i>
            <span class="badge-dot"></span>
        </button>

        <!-- Vertical Separator -->
        <div class="divider"></div>

        <!-- User Profile Dropdown Pill -->
        <div class="profile-pill">
            <div class="avatar">
                <!-- SVG Avatar Circle -->
                <svg viewBox="0 0 36 36" fill="none">
                    <circle cx="18" cy="18" r="18" fill="#FDE8E1" />
                    <circle cx="18" cy="14" r="6" fill="#F97316" />
                    <path d="M8 30C8 24.4772 12.4772 20 18 20C23.5228 20 28 24.4772 28 30" fill="#F97316" />
                </svg>
                <span class="avatar-status"></span>
            </div>
            <div class="profile-info">
                <span class="user-name">CPS Logistics</span>
                <span class="user-role">Admin</span>
            </div>
            <i class="icon icon-chevron-down"></i>
        </div>
    </div>
</header>
