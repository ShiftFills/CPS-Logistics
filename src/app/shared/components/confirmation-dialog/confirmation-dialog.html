@if (open()) {

  <div
    class="dialog-backdrop"
    (click)="onBackdropClick()"
  >

    <div
      class="dialog"
      (click)="$event.stopPropagation()"
    >

      <div class="dialog-header">

        <h2>
          {{ title() }}
        </h2>

      </div>

      <div class="dialog-body">

        <p>
          {{ message() }}
        </p>

      </div>

      <div class="dialog-footer">

        <button
          type="button"
          class="cancel-button"
          (click)="onCancel()"
        >
          {{ cancelText() }}
        </button>

        <button
          type="button"
          [class]="'confirm-button confirm-' + confirmButtonClass()"
          (click)="onConfirm()"
        >
          {{ confirmText() }}
        </button>

      </div>

    </div>

  </div>

}
