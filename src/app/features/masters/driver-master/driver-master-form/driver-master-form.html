<div class="driver-form-page">
  @if (!embedded()) {
    <header class="master-form-header">
      <h1>{{ isEdit() ? 'Update Driver' : 'Create Driver' }}</h1>
    </header>
  }

  <form class="master-form" novalidate (submit)="$event.preventDefault(); save()">
    <div class="row gx-4 gy-3">
      @for (field of fields; track field.key) {
        <div [class]="field.span === 2 ? 'col-12 col-md-6' : 'col-12 col-sm-6 col-md-3'">
          @switch (field.kind) {
            @case ('select') {
              <app-select
                class="form-field"
                [label]="field.label"
                [required]="!!field.required"
                [placeholder]="field.placeholder"
                [options]="optionsFor(field.key)"
                [value]="values()[field.key] ?? ''"
                [error]="errors()[field.key] ?? ''"
                (valueChange)="updateValue(field.key, $event)">
              </app-select>
            }
            @case ('date') {
              <app-date-picker
                class="form-field"
                [label]="field.label"
                [required]="!!field.required"
                [value]="values()[field.key] ?? ''"
                [error]="errors()[field.key] ?? ''"
                (valueChange)="updateValue(field.key, $event)">
              </app-date-picker>
            }
            @case ('file') {
              <app-file-upload
                class="form-field"
                [label]="field.label"
                [compact]="true"
                accept=".pdf,.jpg,.jpeg,.png"
                [fileName]="existingFileName()"
                viewLabel="View Licence"
                [error]="errors()[field.key] ?? ''"
                (filesChange)="onFilesChange($event)"
                (rejected)="onFileRejected($event)"
                (viewClick)="viewLicence()">
              </app-file-upload>
            }
            @default {
              <app-input
                class="form-field"
                [label]="field.label"
                [required]="!!field.required"
                [placeholder]="field.placeholder"
                [value]="values()[field.key] ?? ''"
                [error]="errors()[field.key] ?? ''"
                (valueChange)="updateValue(field.key, $event)">
              </app-input>
            }
          }
        </div>
      }
    </div>

    <!-- Remove stays in the DOM (hidden when creating) so the shared
         .form-dialog button sizing, which relies on child position, still applies. -->
    <div class="form-actions d-flex flex-wrap justify-content-end align-items-center gap-2">
      <app-button class="remove-action" [class.d-none]="!isEdit()" label="Remove" variant="outline" (clicked)="remove()" />
      <app-button label="Reset" variant="secondary" (clicked)="resetForm()" />
      <app-button [label]="isEdit() ? 'Update' : 'Save'" variant="orange" type="submit" [disabled]="saving()" />
    </div>
  </form>
</div>
