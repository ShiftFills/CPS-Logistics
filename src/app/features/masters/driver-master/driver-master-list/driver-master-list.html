<div class="master-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2">
  <app-page-heading
    title="Driver Master"
    subtitle="Manage driver details, licences and bank information">
  </app-page-heading>

  <div class="header-action">
    <app-button label="+ New Driver" variant="orange" size="sm" (clicked)="addDriver()" />
  </div>
</div>

<div class="px-3 px-md-4 pb-4">
  <div class="row g-3 mb-3">
    @for (stat of stats(); track stat.key) {
      <div class="col-12 col-sm-6 col-xl-3">
        <app-card class="stat-card" padding="0">
          <div class="stat d-flex align-items-center">

            <span class="stat-icon" [style.background]="stat.background">
              <img [src]="stat.icon" alt="" aria-hidden="true" />
            </span>

            <div class="stat-body">
              <span class="stat-value">{{ stat.value }}</span>
              <span class="stat-label">{{ stat.label }}</span>
              <div class="stat-trend">
                <img src="assets/icons/up-arrow.svg" alt="" aria-hidden="true" />
                <span>{{ stat.trend }}</span>
              </div>
            </div>

          </div>
        </app-card>
      </div>
    }
  </div>

  <app-card class="list-table-card" padding="0">
    <div class="list-toolbar">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-xl-6">
          <app-search-box
            width="100%"
            placeholder="Search by name, mobile or licence no"
            (searchChange)="onSearch($event)">
          </app-search-box>
        </div>
        <div class="col-12 col-sm-4 col-xl-2">
          <app-select [options]="branchOptions()" [value]="branchFilter()" (valueChange)="onBranchFilter($event)">
          </app-select>
        </div>
        <div class="col-12 col-sm-4 col-xl-2">
          <app-select [options]="statusOptions" [value]="statusFilter()" (valueChange)="onStatusFilter($event)">
          </app-select>
        </div>
        <div class="col-12 col-sm-4 col-xl-2">
          <app-select [options]="licenceOptions" [value]="licenceFilter()" (valueChange)="onLicenceFilter($event)">
          </app-select>
        </div>
      </div>
    </div>

    <app-table
      [columns]="columns()"
      [data]="paginatedRows()"
      [actions]="actions"
      [loading]="loading()"
      [emptyMessage]="hasActiveFilters() ? 'No drivers match your filters.' : 'No drivers found.'"
      [externalSort]="true"
      (sortChange)="onSort($event)"
      (columnsChanged)="columns.set($event)"
      (actionTriggered)="onAction($event)">
    </app-table>

    <app-pagination
      [totalItems]="filtered().length"
      [pageSize]="pageSize"
      [currentPage]="currentPage()"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </app-card>
</div>

<app-modal
  class="form-dialog"
  [open]="formOpen()"
  [appendToBody]="true"
  [title]="selectedId() ? 'Update Driver' : 'Create Driver'"
  width="min(940px, calc(100vw - 16px))"
  (closed)="closeForm()">
  @if (formOpen()) {
    <app-driver-master-form
      [embedded]="true"
      [driverId]="selectedId()"
      (saved)="onDriverSaved()"
      (cancelled)="closeForm()"
      (removeRequested)="onRemoveRequested()">
    </app-driver-master-form>
  }
</app-modal>
