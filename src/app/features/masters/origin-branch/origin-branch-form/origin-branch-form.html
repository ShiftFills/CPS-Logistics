<div class="branch-form-page">
  @if (!embedded()) {
    <header class="form-page-header">
      <h1>{{ isEdit() ? 'Update Origin Branch' : 'Create Origin Branch' }}</h1>
    </header>
  }

  <form #branchForm class="branch-form" (submit)="$event.preventDefault(); save(branchForm)">
    <div class="row gx-4 gy-2">
      @for (field of fields; track field.key) {
        <div class="col-12 col-sm-6 col-md-3">
          @if (field.kind === 'select') {
            <app-select
              class="branch-field"
              [label]="field.label"
              [required]="!!field.required"
              [placeholder]="field.placeholder"
              [options]="optionsFor(field.key)"
              [value]="values()[field.key] ?? ''"
              (valueChange)="updateValue(field.key, $event)">
            </app-select>
          } @else {
            <app-input
              class="branch-field"
              [label]="field.label"
              [required]="!!field.required"
              [placeholder]="field.placeholder"
              [type]="field.type ?? 'text'"
              [value]="values()[field.key] ?? ''"
              (valueChange)="updateValue(field.key, $event)">
            </app-input>
          }
        </div>
      }
    </div>

    <div class="form-actions d-flex flex-wrap justify-content-end align-items-center gap-2">
      <app-button class="remove-action" label="Remove" variant="outline" (clicked)="remove()" />
      <app-button label="Reset" variant="secondary" (clicked)="resetForm()" />
      <app-button label="Update" variant="orange" type="submit" />
    </div>
  </form>
</div>
