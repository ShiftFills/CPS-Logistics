<div class="container-fluid vh-100 p-0 ">
    <div class="row g-0 h-100">

        <!-- Left Hero / Branding Section -->
        <div
            class="col-lg-6 hero-section  d-lg-flex flex-column justify-content-between px-5 pb-0 position-relative">

            <!-- Logo -->
            <div class="branding-logo">
                <img [src]="logoPath" alt="CPS Logistics Logo" class="img-fluid logo-img" />
            </div>

            <!-- Center Content -->
            <div class="hero-content my-auto pe-5">
                <h1 class="hero-title fw-bold mb-0">
                    Streamline<br />
                    Your Logistics
                </h1>

                <p class="hero-subtitle mb-0">
                    Smarter transport. Better tomorrow.
                </p>
            </div>

            <!-- Truck Graphic -->
            <div class="hero-illustration-container mt-2 pt-5">
                <img [src]="truckImagePath" alt="Logistics Truck Illustration" class="truck-img" />
            </div>

        </div>

        <!-- Right Login Form Section -->
        <div class="col-lg-6 col-12 d-flex align-items-center justify-content-center bg-white p-4 p-md-5">
            <div class="login-card-container w-100">

                <!-- Header -->
                <div class="mb-4">
                    <h2 class="login-title fw-bold mb-1">
                        Login
                    </h2>

                    <p class="text-muted sub-title">
                        Enter your credentials to continue
                    </p>
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                    <!-- Username -->
                    <div class="mb-3">
                        <app-input placeholder="Username" type="text" [value]="loginForm.get('username')?.value"
                            icon="bi-person" (valueChange)="onControlChange('username', $event)">
                        </app-input>
                    </div>

                    <!-- Password -->
                    <div class="mb-3 position-relative">

                        <app-input placeholder="Password" type="password" icon="bi-lock" [passwordToggle]="true"
                            [value]="loginForm.get('password')?.value"
                            (valueChange)="onControlChange('password', $event)">
                        </app-input>



                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-4 fs-7">

                        <div class="remember-me">
                            <app-checkbox label="Remember me" [checked]="loginForm.get('rememberMe')?.value"
                                (checkedChange)="onRememberMeChange($event)">
                            </app-checkbox>
                        </div>

                        <a href="javascript:void(0)" class="text-orange text-decoration-none fw-medium">
                            Forgot password?
                        </a>

                    </div>

                    <!-- Reusable Login Button -->
                    <div class="login-button-wrapper mb-4">

                        <app-button label="Login" type="submit" variant="orange" size="lg">
                        </app-button>

                    </div>

                </form>

                <!-- Divider -->
                <div class="divider d-flex align-items-center my-4">

                    <div class="flex-grow-1 border-bottom"></div>

                    <span class="px-3 text-muted fs-7 fw-normal">
                        or
                    </span>

                    <div class="flex-grow-1 border-bottom"></div>

                </div>

                <!-- Footer -->
                <div class="text-center text-muted fs-7">

                    Don't have an account?

                    <a href="javascript:void(0)" class="text-orange text-decoration-none fw-semibold ms-1">
                        Contact your administrator
                    </a>

                </div>

            </div>
        </div>

    </div>
</div>
